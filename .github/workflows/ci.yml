name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas del núcleo
        run: node --test
      - name: Sintaxis de los módulos del navegador
        run: for f in js/*.js js/ui/*.js; do node --check "$f"; done
